<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Jobs Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --portal-bg: #0f172a;
            --portal-accent: #38bdf8;
            --page-bg: #f8fafc;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.15), transparent 26%),
                radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.12), transparent 28%),
                var(--page-bg);
        }

        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 55%, #0ea5e9 100%);
            color: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
        }

        .soft-card {
            border: 1px solid rgba(148, 163, 184, 0.22);
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
            border-radius: 1.25rem;
        }

        .job-tag {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            padding: .35rem .7rem;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.12);
            color: #0369a1;
            font-size: .82rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

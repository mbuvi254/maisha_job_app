{% extends 'jobs/job_base.html' %}
{% block page_title %}Apply for Job{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-8">
            <div class="hero-banner p-4 p-lg-5 mb-4">
                <span class="job-tag mb-3"><i class="bi bi-send"></i> Application</span>
                <h1 class="display-6 fw-bold mb-2">{{ job.title if job else 'Apply for Job' }}</h1>
                <p class="lead mb-0 text-white-75">{{ job.experience_level if job else '' }}</p>
            </div>

            <div class="card soft-card border-0">
                <div class="card-body p-4 p-lg-5">
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('jobs_bp.job_apply', job_id=job.id) }}" class="row g-4">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label">First Name</label>
                            <input type="text" id="first_name" name="first_name" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label">Last Name</label>
                            <input type="text" id="last_name" name="last_name" class="form-control form-control-lg">
                        </div>
                        <div class="col-12">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-12">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" id="phone" name="phone" class="form-control form-control-lg">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Submit Application
                            </button>
                            <a href="{{ url_for('jobs_bp.job_detail', job_id=job.id) }}" class="btn btn-outline-secondary btn-lg ms-2">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

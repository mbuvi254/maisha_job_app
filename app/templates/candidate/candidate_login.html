{% extends 'jobs/job_base.html' %}
{% block page_title %}Candidate Login{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card soft-card border-0 shadow-sm">
                <div class="card-body p-4 p-lg-5">
                    <div class="mb-4">
                        <span class="job-tag mb-3"><i class="bi bi-person-badge"></i> Candidate Login</span>
                        <h1 class="h3 fw-bold mb-2">Log in to continue</h1>
                        <p class="text-muted mb-0">We will send a verification code to your candidate email.</p>
                    </div>

                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('candidate_bp.login_candidate', next=next_url) }}" class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-12 d-flex flex-wrap gap-2 pt-2">
                            <button type="submit" class="btn btn-primary btn-lg">Send OTP</button>
                            <a href="{{ url_for('candidate_bp.register_candidate', next=next_url) }}" class="btn btn-outline-primary btn-lg">Create account</a>
                            <a href="{{ url_for('jobs_bp.index') }}" class="btn btn-link btn-lg text-decoration-none">Back to jobs</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
